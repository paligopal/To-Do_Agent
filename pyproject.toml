[project]
name = "to-do-agent"
version = "0.1.0"
description = "A local-first desktop todo app with a messenger-agent integration layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2,<3",
    "PyQt6>=6.7",
]

[project.scripts]
todo-agent-mcp = "todo_agent.mcp_server:main"

[tool.uv]
package = true
